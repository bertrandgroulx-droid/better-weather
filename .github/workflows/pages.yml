name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pinned rather than ubuntu-latest: on 2026-10-05 four deploys in a row were
    # dropped with "not acquired by Runner of type hosted" while queued on the
    # ubuntu-latest pool (which is migrating to Ubuntu 26 from Oct 19).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically if it isn't enabled yet.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site — index.html lives at the root.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
