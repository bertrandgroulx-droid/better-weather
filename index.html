<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>Better Weather</title>
<meta name="description" content="Better Weather — a phone-first, single-screen weather app: condensed current summary plus horizontally scrollable hourly and daily strips with history. Powered by the free Open-Meteo API, no key required." />
<meta name="color-scheme" content="dark" />

<!-- Home-screen icon + standalone launch (iOS uses apple-touch-icon) -->
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Better Weather" />
<meta name="theme-color" content="#0b1f3a" />

<!-- Leaflet (for the animated radar map) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  :root {
    --bg-1: #0b1f3a;
    --bg-2: #123255;
    --bg-3: #17456e;
    --card: rgba(255, 255, 255, 0.06);
    --card-2: rgba(255, 255, 255, 0.10);
    --border: rgba(255, 255, 255, 0.14);
    --text: #f3f8ff;
    --muted: #9fb6d0;
    --accent: #ffd166;
    --precip: #4cc9f0;
    --radius: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    background-attachment: fixed;
    /* Size to the SMALL viewport (browser chrome visible) so the top is never
       hidden behind a mobile address bar; fall back to vh on old browsers.
       Allow vertical scroll as a safety net instead of hard-clipping. */
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 10px);
  }
  body.night { --bg-1: #050f1e; --bg-2: #0a1f38; --bg-3: #0f2c48; }

  /* ---------------- top bar ---------------- */
  .topbar { display: flex; align-items: center; gap: 8px; }
  .brand {
    display: flex; align-items: center; gap: 5px;
    font-size: 0.95rem; font-weight: 700; white-space: nowrap;
  }
  .brand .logo { font-size: 1.2rem; }
  .brand .name { display: none; }
  @media (min-width: 420px) { .brand .name { display: inline; } }

  .city-pill {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 0.5rem 0.9rem;
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 999px; color: var(--text);
    font-size: 0.95rem; font-family: inherit; cursor: pointer;
    overflow: hidden;
  }
  .city-pill .nm { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .city-pill .mag { color: var(--muted); }

  .units {
    display: flex; align-items: center;
    border: 1px solid var(--border); border-radius: 999px;
    overflow: hidden; background: var(--card-2); flex: none;
  }
  .units button {
    border: none; background: transparent; color: var(--muted);
    font-family: inherit; font-size: 0.9rem; font-weight: 700;
    padding: 0.45rem 0.7rem; cursor: pointer;
  }
  .units button.active { background: var(--accent); color: #0b1f3a; }

  /* ---------------- summary ---------------- */
  .summary {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 0;
    display: flex; justify-content: space-evenly; align-items: stretch;
    flex: none;
  }
  .sum-left { display: flex; flex-direction: column; }
  .sum-hero { display: flex; align-items: center; gap: 6px; }
  .sum-hero .ico { font-size: 2.8rem; line-height: 1; }
  .sum-hero .temp { font-size: 2.9rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  /* push the metrics to the bottom so the Wind line aligns with the Sunset line */
  .sum-metrics { margin-top: auto; padding-top: 8px; font-size: 0.82rem; line-height: 1.5; color: var(--text); }
  .sum-metrics b { font-weight: 700; }
  .sum-metrics .k { color: var(--muted); }
  .sum-right { font-size: 0.86rem; line-height: 1.45; white-space: nowrap; }
  .sum-right .cond { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
  .sum-right .row { color: var(--text); }
  .sum-right .row .k { color: var(--muted); }

  /* ---------------- scrolling sections ---------------- */
  .result {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column; gap: 16px;
  }
  .content {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    justify-content: space-evenly;
  }
  .section { display: flex; flex-direction: column; }
  .section > h2 {
    margin: 0 0 6px; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em;
  }
  .scroller {
    display: flex; gap: 0;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar { display: none; }
  #hourly { height: 172px; }
  #daily  { height: 196px; }

  .cell {
    position: relative; overflow: hidden;
    flex: 0 0 calc(100% / 6); height: 100%;
    background: transparent; border: none; border-radius: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 1px 5px; gap: 0;
    text-align: center;
  }
  .cell.now, .cell.today { background: rgba(255,209,102,0.13); border-radius: 10px; }
  /* subtle divider + weekday label at the start of each day (hourly) */
  .cell.daystart { box-shadow: inset 1px 0 0 var(--border); }
  .cell > * { position: relative; z-index: 1; }
  .cell .dow { font-size: 0.64rem; height: 0.92rem; line-height: 0.92rem; font-weight: 700;
    color: var(--muted); letter-spacing: 0.02em; }
  .cell.now .dow { color: var(--accent); }
  .cell .lbl { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  .cell.now .lbl, .cell.today .lbl { color: var(--accent); }
  .cell .ic { font-size: 1.75rem; line-height: 1.1; }
  .cell .ic.sm { font-size: 1.35rem; }
  .cell .big { font-size: 1.4rem; font-weight: 800; line-height: 1.1; }
  .cell .sub { font-size: 0.66rem; color: var(--muted); white-space: nowrap; }
  .cell .pop { font-size: 0.76rem; color: var(--precip); white-space: nowrap; }
  .cell .spacer { flex: 1; min-height: 2px; }
  .cell .pamt { font-size: 0.66rem; color: #cfeaff; white-space: nowrap; }

  /* precip water fill */
  .water { position: absolute; left: 0; right: 0; bottom: 0; z-index: 0;
    background: linear-gradient(to bottom, rgba(76,201,240,0.55), rgba(28,126,214,0.45)); }
  .water svg { position: absolute; top: -6px; left: 0; width: 100%; height: 8px; display: block;
    fill: rgba(76,201,240,0.55); }

  /* scroll-position indicator */
  .track { height: 5px; border-radius: 999px; background: rgba(255,255,255,0.12); margin-top: 8px; position: relative; }
  .thumb { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: var(--accent); min-width: 24px; }
  /* fixed "Now" / "Today" reference marker on the track */
  .marker { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%;
    background: #fff; border: 2px solid var(--bg-1);
    transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }

  /* ---------------- status ---------------- */
  .status { margin: auto; text-align: center; color: var(--muted); padding: 1.5rem; }
  .status.error { color: #ffc9c9; }
  .hidden { display: none !important; }

  /* ---------------- search modal ---------------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(4, 12, 24, 0.72);
    display: flex; align-items: flex-start; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 40px) 16px 16px;
  }
  .modal {
    width: 100%; max-width: 440px;
    background: #0e2440; border: 1px solid var(--border);
    border-radius: 16px; padding: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.5);
  }
  .modal-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .modal input {
    flex: 1; padding: 0.7rem 0.9rem; font-size: 1rem; font-family: inherit;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text); outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal .close {
    border: none; background: var(--card-2); color: var(--text);
    border-radius: 10px; padding: 0.7rem 0.85rem; font-size: 1rem; cursor: pointer;
  }
  .results { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow-y: auto; }
  .results li { padding: 0.7rem 0.6rem; border-radius: 10px; cursor: pointer; }
  .results li:hover, .results li.hi { background: var(--card-2); }
  .results .sub { color: var(--muted); font-size: 0.82rem; }
  .results .geo { color: var(--accent); }
  .results .empty { color: var(--muted); padding: 0.7rem 0.6rem; }

  /* ---------------- radar tab ---------------- */
  #radar { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #0b1f3a; }
  #map .maperr { color: var(--muted); text-align: center; padding: 40% 1rem 0; }
  .leaflet-container { background: #0b1f3a; font-family: inherit; }
  .radar-ctrl {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1000;
    display: flex; align-items: center; gap: 10px;
    background: rgba(11, 31, 58, 0.82); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 12px;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .radar-model {
    position: absolute; left: 10px; bottom: 66px; z-index: 1000;
    background: rgba(11, 31, 58, 0.82); border: 1px solid var(--border);
    border-radius: 10px; padding: 5px 9px; font-size: 0.7rem; color: var(--text);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .radar-model:empty { display: none; }
  .radar-ctrl input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .radar-ctrl .t { font-size: 0.78rem; color: var(--text); min-width: 118px; text-align: right; white-space: nowrap; }
  .radar-legend {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(11, 31, 58, 0.82); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 9px; font-size: 0.72rem; color: var(--text);
    display: flex; flex-direction: column; gap: 3px;
  }
  .radar-legend .lg-title { font-size: 0.66rem; color: var(--muted); margin-bottom: 2px; }
  .radar-legend .lg-grad { width: 116px; height: 9px; border-radius: 5px;
    background: linear-gradient(90deg, #7ec8f5, #3f8fd8, #f2e400, #f59a0b, #e0140a); }
  .radar-legend .lg-ends { display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--muted); margin-top: 1px; }

  /* ---------------- bottom tab bar ---------------- */
  .tabbar { display: flex; gap: 8px; flex: none; }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: var(--card-2); border: 1px solid var(--border); border-radius: 12px;
    color: var(--muted); font-family: inherit; font-weight: 600; padding: 5px 0; cursor: pointer;
  }
  .tab .ic { font-size: 1.2rem; line-height: 1.1; }
  .tab .lb { font-size: 0.72rem; }
  .tab.active { color: #0b1f3a; background: var(--accent); border-color: transparent; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">⛅</span><span class="name">Better Weather</span></div>
    <button class="city-pill" id="cityPill" type="button">
      <span class="nm" id="cityName">Loading…</span>
      <span class="mag">🔍</span>
    </button>
    <div class="units" role="group" aria-label="Temperature units">
      <button type="button" id="unitC">°C</button>
      <button type="button" id="unitF">°F</button>
    </div>
  </div>

  <div class="status" id="status">Loading your weather…</div>

  <div class="result hidden" id="result">
    <section class="summary" id="summary"></section>

    <div class="content" id="content">
      <section class="section" id="hourlySec">
        <h2>Hourly</h2>
        <div class="scroller" id="hourly"></div>
        <div class="track"><div class="thumb" id="hThumb"></div><div class="marker" id="hMarker"></div></div>
      </section>

      <section class="section" id="dailySec">
        <h2>Daily</h2>
        <div class="scroller" id="daily"></div>
        <div class="track"><div class="thumb" id="dThumb"></div><div class="marker" id="dMarker"></div></div>
      </section>
    </div>
  </div>

  <!-- radar view -->
  <div id="radar" class="hidden">
    <div id="map"></div>
    <div class="radar-legend">
      <div class="lg-title">Precipitation</div>
      <div class="lg-grad"></div>
      <div class="lg-ends"><span>Light</span><span>Heavy</span></div>
    </div>
    <div class="radar-model" id="radarModel"></div>
    <div class="radar-ctrl">
      <input id="frameSlider" type="range" min="0" max="0" value="0" aria-label="Radar time" />
      <span class="t" id="frameTime">—</span>
    </div>
  </div>

  <!-- bottom tab bar -->
  <nav class="tabbar">
    <button class="tab active" id="tabWeather" type="button"><span class="ic">🌤️</span><span class="lb">Weather</span></button>
    <button class="tab" id="tabRadar" type="button"><span class="ic">🗺️</span><span class="lb">Map</span></button>
  </nav>

  <!-- search modal -->
  <div class="backdrop hidden" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Search for a city">
      <div class="modal-head">
        <input id="searchInput" type="text" placeholder="Search a city…" autocomplete="off" />
        <button class="close" id="closeModal" type="button" aria-label="Close">✕</button>
      </div>
      <ul class="results" id="results"></ul>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    status: $("status"), result: $("result"), summary: $("summary"),
    hourlySec: $("hourlySec"), hourly: $("hourly"), hThumb: $("hThumb"), hMarker: $("hMarker"),
    dailySec: $("dailySec"), daily: $("daily"), dThumb: $("dThumb"), dMarker: $("dMarker"),
    cityPill: $("cityPill"), cityName: $("cityName"),
    unitC: $("unitC"), unitF: $("unitF"),
    backdrop: $("backdrop"), searchInput: $("searchInput"),
    closeModal: $("closeModal"), results: $("results"),
    radar: $("radar"), frameSlider: $("frameSlider"), frameTime: $("frameTime"),
    radarModel: $("radarModel"), tabWeather: $("tabWeather"), tabRadar: $("tabRadar"),
  };

  // ===== Mapbox public token (starts with pk.), restricted to this site's URL.
  //       It's a PUBLIC token — safe to expose — and is only base64-encoded here
  //       so GitHub's secret-scanner push protection doesn't false-positive on
  //       the pk. pattern. To change it: base64-encode your token and paste the
  //       result below (or set it to a plain "pk...." string). Blank = OSM fallback. =====
  var MAPBOX_TOKEN = atob("cGsuZXlKMUlqb2lZbVZ5ZEhKaGJtUm5jbTkxYkhnaUxDSmhJam9pWTIxMGJIcG1ZbkUyTURGd2NqTTBjSGwxYlhGaWIyWnROQ0o5LnJjamswWkNPQzh0ZFFVN1lOcDlUYnc=");

  var units = localStorage.getItem("bw-units") || "metric"; // "metric" | "imperial"
  var lastLoc = null;
  var lastTz = null; // IANA timezone of the active location (for the map clock)
  var searchTimer = null;
  var currentTab = "weather";
  var loaded = false;

  // ---- weather code → [emoji, label] ----
  var WMO = {
    0:["☀️","Clear sky"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
    45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],
    55:["🌧️","Dense drizzle"],56:["🌧️","Freezing drizzle"],57:["🌧️","Freezing drizzle"],
    61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],
    67:["🌧️","Freezing rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],
    77:["🌨️","Snow grains"],80:["🌦️","Light showers"],81:["🌧️","Showers"],82:["⛈️","Violent showers"],
    85:["🌨️","Snow showers"],86:["❄️","Heavy snow showers"],95:["⛈️","Thunderstorm"],
    96:["⛈️","Thunder + hail"],99:["⛈️","Thunder + hail"]
  };
  function wmo(c) { return WMO[c] || ["❓","Unknown"]; }
  // Night-aware icon for clear/partly conditions.
  function icon(code, isDay) {
    if (isDay === 0) {
      if (code === 0 || code === 1) return "🌙";
      if (code === 2) return "☁️";
    }
    return wmo(code)[0];
  }

  // ---- units ----
  function tU() { return units === "imperial" ? "°F" : "°C"; }
  function wU() { return units === "imperial" ? "mph" : "km/h"; }
  function pU() { return units === "imperial" ? '"' : "mm"; }
  // Water-fill scale as [safe, full] in the current unit:
  //  - up to `safe` the fill uses a sqrt curve within the empty "safe zone"
  //    (spreads the low end so <1mm reads shorter than 2mm, and stays clear
  //     of the text)
  //  - beyond `safe` it grows toward the top, bleeding into the text only for
  //    genuinely heavy amounts, reaching near-full at `full`.
  function precipScaleH() { return units === "imperial" ? [0.16, 0.47] : [4, 12]; }   // hourly
  function precipScaleD() { return units === "imperial" ? [0.55, 1.6] : [14, 40]; }   // daily

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtHour(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: "numeric" }).replace(/\s/g, "").toLowerCase();
  }
  function fmtClock(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase();
  }
  function precipLabel(v, daily) {
    if (v == null || v <= 0) return "";
    if (units === "imperial") return (v < 0.05 ? "<0.05" : v.toFixed(2)) + '"';
    if (daily) return (v < 1 ? "<1 mm" : Math.round(v) + " mm");
    return v.toFixed(1) + "mm";
  }

  function fetchJson(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("request failed (" + r.status + ")");
      return r.json();
    });
  }

  // ---- geocoding ----
  function geocode(q, count) {
    var url = "https://geocoding-api.open-meteo.com/v1/search?count=" + (count || 1) +
      "&language=en&format=json&name=" + encodeURIComponent(q);
    return fetchJson(url).then(function (d) { return d.results || []; });
  }
  function toLoc(r) {
    return { lat: r.latitude, lon: r.longitude, name: r.name, admin: r.admin1, country: r.country };
  }
  function placeSub(loc) { return [loc.admin, loc.country].filter(Boolean).join(", "); }

  // ---- forecast (with 7 days history + 16 days ahead) ----
  function getWeather(loc) {
    var tu = units === "imperial" ? "fahrenheit" : "celsius";
    var wu = units === "imperial" ? "mph" : "kmh";
    var pu = units === "imperial" ? "inch" : "mm";
    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + loc.lat + "&longitude=" + loc.lon +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,precipitation,is_day" +
      "&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset" +
      "&temperature_unit=" + tu + "&wind_speed_unit=" + wu + "&precipitation_unit=" + pu +
      "&timezone=auto&past_days=7&forecast_days=16";
    return fetchJson(url);
  }

  // ERA5 reanalysis (observation-assimilated) for the past week. It lags a few
  // days, so only the older history days come back populated; the rest fall
  // back to the forecast model's analysis.
  function getArchive(loc) {
    var tu = units === "imperial" ? "fahrenheit" : "celsius";
    var wu = units === "imperial" ? "mph" : "kmh";
    var pu = units === "imperial" ? "inch" : "mm";
    var d0 = new Date(), d1 = new Date();
    d0.setDate(d0.getDate() - 8);
    d1.setDate(d1.getDate() - 1);
    var iso = function (dt) { return dt.toISOString().slice(0, 10); };
    var url = "https://archive-api.open-meteo.com/v1/archive" +
      "?latitude=" + loc.lat + "&longitude=" + loc.lon +
      "&start_date=" + iso(d0) + "&end_date=" + iso(d1) +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,sunrise,sunset" +
      "&temperature_unit=" + tu + "&wind_speed_unit=" + wu + "&precipitation_unit=" + pu +
      "&timezone=auto";
    return fetchJson(url);
  }

  // Override the "measured" daily fields with reanalysis where available.
  // Precipitation probability isn't a reanalysis quantity, so the model
  // analysis value is kept for it.
  function mergeArchive(d, arch) {
    if (!arch || !arch.daily || !arch.daily.time) return;
    var a = arch.daily, idx = {};
    for (var i = 0; i < a.time.length; i++) idx[a.time[i]] = i;
    var dd = d.daily, today = d.current.time.slice(0, 10);
    for (var j = 0; j < dd.time.length; j++) {
      if (dd.time[j] >= today) continue;          // past days only
      var k = idx[dd.time[j]];
      if (k == null || a.temperature_2m_max[k] == null) continue; // not in ERA5 yet
      dd.temperature_2m_max[j] = a.temperature_2m_max[k];
      dd.temperature_2m_min[j] = a.temperature_2m_min[k];
      if (a.precipitation_sum[k] != null) dd.precipitation_sum[j] = a.precipitation_sum[k];
      if (a.weather_code && a.weather_code[k] != null) dd.weather_code[j] = a.weather_code[k];
      if (a.wind_speed_10m_max && a.wind_speed_10m_max[k] != null) dd.wind_speed_10m_max[j] = a.wind_speed_10m_max[k];
      if (a.sunrise && a.sunrise[k]) dd.sunrise[j] = a.sunrise[k];
      if (a.sunset && a.sunset[k]) dd.sunset[j] = a.sunset[k];
    }
  }

  // ================= rendering =================

  function todayIndex(d) {
    var date = d.current.time.slice(0, 10);
    var i = d.daily.time.indexOf(date);
    return i < 0 ? 0 : i;
  }
  // Return {maxTime, minTime, minWind} computed from today's hourly slice.
  function todayExtremes(d) {
    var date = d.current.time.slice(0, 10), h = d.hourly;
    var maxT = -Infinity, minT = Infinity, minW = Infinity, maxTime = null, minTime = null;
    for (var i = 0; i < h.time.length; i++) {
      if (h.time[i].slice(0, 10) !== date) continue;
      var t = h.temperature_2m[i];
      if (t > maxT) { maxT = t; maxTime = h.time[i]; }
      if (t < minT) { minT = t; minTime = h.time[i]; }
      if (h.wind_speed_10m[i] < minW) minW = h.wind_speed_10m[i];
    }
    return { maxTime: maxTime, minTime: minTime, minWind: isFinite(minW) ? minW : null };
  }

  function renderSummary(loc, d) {
    var c = d.current, ti = todayIndex(d), dd = d.daily, ex = todayExtremes(d);
    var w = wmo(c.weather_code);
    document.body.classList.toggle("night", c.is_day === 0);

    var hi = Math.round(dd.temperature_2m_max[ti]);
    var lo = Math.round(dd.temperature_2m_min[ti]);
    var hiTime = ex.maxTime ? " (" + fmtClock(ex.maxTime) + ")" : "";
    var loTime = ex.minTime ? " (" + fmtClock(ex.minTime) + ")" : "";
    var sr = fmtClock(dd.sunrise[ti]);
    var ss = fmtClock(dd.sunset[ti]);
    var pop = dd.precipitation_probability_max[ti];
    var psum = dd.precipitation_sum[ti];
    var windH = Math.round(dd.wind_speed_10m_max[ti]);
    var windL = ex.minWind == null ? "–" : Math.round(ex.minWind);

    els.summary.innerHTML =
      '<div class="sum-left">' +
        '<div class="sum-hero"><span class="ico">' + w[0] + '</span>' +
          '<span class="temp">' + Math.round(c.temperature_2m) + tU() + '</span></div>' +
        '<div class="sum-metrics">' +
          '<div><b>POP</b> ' + (pop == null ? "–" : pop + "%") + '</div>' +
          '<div><b>Precip</b> ' + (psum == null ? "0" : psum) + ' ' + pU() + '</div>' +
          '<div><b>Wind</b> <span class="k">H:</span>' + windH + ' ' + wU() +
            ' <span class="k">L:</span>' + windL + ' ' + wU() + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sum-right">' +
        '<div class="cond">' + w[1] + '</div>' +
        '<div class="row"><span class="k">Feels</span> ' + Math.round(c.apparent_temperature) + tU() + '</div>' +
        '<div class="row"><span class="k">H:</span> ' + hi + '°' + hiTime + '</div>' +
        '<div class="row"><span class="k">L:</span> ' + lo + '°' + loTime + '</div>' +
        '<div class="row"><span class="k">Sunrise</span> ' + sr + '</div>' +
        '<div class="row"><span class="k">Sunset</span> ' + ss + '</div>' +
      '</div>';
  }

  var SAFE_TOP = 0.34; // fraction of the cell the fill can reach before touching text

  function waterFrac(amount, safe, full) {
    if (amount == null || amount <= 0) return 0;
    if (amount <= safe) return Math.sqrt(amount / safe) * SAFE_TOP; // spread the low end
    var t = Math.min(1, (amount - safe) / (full - safe));
    return SAFE_TOP + t * (0.9 - SAFE_TOP);
  }

  function waterHtml(amount, scale) {
    var frac = waterFrac(amount, scale[0], scale[1]);
    if (frac <= 0) return "";
    var pct = (frac * 100).toFixed(1);
    return '<div class="water" style="height:' + pct + '%">' +
      '<svg viewBox="0 0 100 8" preserveAspectRatio="none">' +
      '<path d="M0,5 Q25,0 50,4 T100,3 V8 H0 Z"/></svg></div>';
  }

  function renderHourly(d) {
    var h = d.hourly, now = d.current.time;
    // Window: up to 48h of history and 72h into the future.
    var nowIdx = h.time.indexOf(now);
    if (nowIdx < 0) nowIdx = h.time.findIndex(function (x) { return x >= now; });
    if (nowIdx < 0) nowIdx = 0;
    var start = Math.max(0, nowIdx - 48);
    var end = Math.min(h.time.length, nowIdx + 73);
    var scale = precipScaleH();
    var html = "", prevDay = null;
    for (var i = start; i < end; i++) {
      var isNow = i === nowIdx;
      var amt = h.precipitation[i];
      var day = h.time[i].slice(0, 10);
      var boundary = (i === start) || (day !== prevDay);
      prevDay = day;
      var dow = isNow ? "Today"
        : (boundary ? new Date(h.time[i] + ":00").toLocaleDateString(undefined, { weekday: "short" }) : "");
      html +=
        '<div class="cell' + (isNow ? " now" : "") + (boundary && !isNow ? " daystart" : "") + '">' +
          waterHtml(amt, scale) +
          '<div class="dow">' + dow + '</div>' +
          '<div class="lbl">' + (isNow ? "Now" : fmtHour(h.time[i])) + '</div>' +
          '<div class="ic">' + icon(h.weather_code[i], h.is_day[i]) + '</div>' +
          '<div class="big">' + Math.round(h.temperature_2m[i]) + '°</div>' +
          '<div class="sub">Feels ' + Math.round(h.apparent_temperature[i]) + '°</div>' +
          '<div class="pop">💧' + (h.precipitation_probability[i] == null ? 0 : h.precipitation_probability[i]) + '%</div>' +
          '<div class="spacer"></div>' +
          (amt > 0 ? '<div class="pamt">' + precipLabel(amt, false) + '</div>' : '') +
        '</div>';
    }
    els.hourly.innerHTML = html;
  }

  function renderDaily(d) {
    var dd = d.daily, ti = todayIndex(d), scale = precipScaleD();
    var html = "";
    for (var i = 0; i < dd.time.length; i++) {
      var isToday = i === ti;
      var date = new Date(dd.time[i] + "T00:00:00");
      var name = isToday ? "Today"
        : date.toLocaleDateString(undefined, { weekday: "short" }) + " " + date.getDate();
      var amt = dd.precipitation_sum[i];
      var code = dd.weather_code[i];
      html +=
        '<div class="cell' + (isToday ? " today" : "") + '">' +
          waterHtml(amt, scale) +
          '<div class="lbl">' + name + '</div>' +
          '<div class="ic">' + wmo(code)[0] + '</div>' +
          '<div class="big">' + Math.round(dd.temperature_2m_max[i]) + '°</div>' +
          '<div class="ic sm">' + icon(code, 0) + '</div>' +
          '<div class="big" style="font-weight:600">' + Math.round(dd.temperature_2m_min[i]) + '°</div>' +
          '<div class="pop">💧' + (dd.precipitation_probability_max[i] == null ? 0 : dd.precipitation_probability_max[i]) + '%</div>' +
          '<div class="spacer"></div>' +
          (amt > 0 ? '<div class="pamt">' + precipLabel(amt, true) + '</div>' : '') +
        '</div>';
    }
    els.daily.innerHTML = html;
  }

  // Open each strip at the current hour / today (history sits to the left).
  function scrollToClass(scroller, cls) {
    var el = scroller.querySelector("." + cls);
    if (el) scroller.scrollLeft = el.offsetLeft - 4;
  }

  function updateThumb(scroller, thumb) {
    var sw = scroller.scrollWidth, cw = scroller.clientWidth;
    var max = sw - cw;
    var ratio = sw > 0 ? cw / sw : 1;
    var wPct = Math.max(10, ratio * 100);
    thumb.style.width = wPct + "%";
    var lr = max > 0 ? scroller.scrollLeft / max : 0;
    thumb.style.left = (lr * (100 - wPct)) + "%";
  }

  // Place the fixed Now/Today marker at that cell's position within the whole track.
  function positionMarker(scroller, marker, cls) {
    var el = scroller.querySelector("." + cls);
    if (!el || scroller.scrollWidth <= 0) { marker.style.display = "none"; return; }
    var center = el.offsetLeft + el.offsetWidth / 2;
    marker.style.display = "block";
    marker.style.left = (center / scroller.scrollWidth * 100) + "%";
  }

  function bindThumb(scroller, thumb) {
    scroller.addEventListener("scroll", function () { updateThumb(scroller, thumb); }, { passive: true });
  }

  // ================= flow =================

  function setStatus(msg, err) {
    els.status.textContent = msg;
    els.status.classList.toggle("error", !!err);
    if (currentTab === "weather") {
      els.status.classList.remove("hidden");
      els.result.classList.add("hidden");
    }
  }
  function showResult() {
    loaded = true;
    if (currentTab === "weather") {
      els.status.classList.add("hidden");
      els.result.classList.remove("hidden");
    }
  }

  function show(loc) {
    lastLoc = loc;
    els.cityName.textContent = loc.name;
    recenterMap(loc);
    setStatus("Loading weather for " + loc.name + "…");
    // Fetch the forecast and the ERA5 archive together; the archive is optional
    // and only improves the older history days.
    return Promise.all([
      getWeather(loc),
      getArchive(loc).catch(function () { return null; })
    ]).then(function (res) {
      var d = res[0];
      lastTz = d.timezone || null;               // location's timezone
      if (frames.length) frameLabel(animPos);    // refresh the map clock in it
      mergeArchive(d, res[1]);
      showResult(); // unhide first so the strips have layout to measure
      renderSummary(loc, d);
      renderHourly(d);
      renderDaily(d);
      // Open each strip at Now/Today (history to the left) once laid out.
      requestAnimationFrame(function () {
        scrollToClass(els.hourly, "now");
        scrollToClass(els.daily, "today");
        updateThumb(els.hourly, els.hThumb);
        updateThumb(els.daily, els.dThumb);
        positionMarker(els.hourly, els.hMarker, "now");
        positionMarker(els.daily, els.dMarker, "today");
      });
    }).catch(function (err) {
      setStatus("Couldn't load the weather. " + err.message, true);
    });
  }

  // ---- search modal ----
  function openModal() {
    els.backdrop.classList.remove("hidden");
    els.searchInput.value = "";
    els.results.innerHTML =
      '<li class="geo" data-geo="1">📍 Use my current location</li>';
    setTimeout(function () { els.searchInput.focus(); }, 30);
  }
  function closeModal() { els.backdrop.classList.add("hidden"); }

  function renderResults(list) {
    var html = '<li class="geo" data-geo="1">📍 Use my current location</li>';
    if (!list.length) {
      html += '<li class="empty">No matches — try another spelling.</li>';
    } else {
      list.forEach(function (r, i) {
        var loc = toLoc(r);
        html += '<li data-i="' + i + '">' + esc(loc.name) +
          ' <span class="sub">' + esc(placeSub(loc)) + '</span></li>';
      });
    }
    els.results.innerHTML = html;
    els.results._list = list;
  }

  function onSearchInput() {
    clearTimeout(searchTimer);
    var q = els.searchInput.value.trim();
    if (q.length < 2) { renderResults([]); els.results.querySelector(".empty") && (els.results.querySelector(".empty").textContent = "Keep typing…"); return; }
    searchTimer = setTimeout(function () {
      geocode(q, 8).then(renderResults).catch(function () { renderResults([]); });
    }, 250);
  }

  function onResultsClick(e) {
    var li = e.target.closest("li");
    if (!li) return;
    if (li.dataset.geo) { closeModal(); useLocation(); return; }
    if (li.dataset.i != null) {
      var r = els.results._list[+li.dataset.i];
      closeModal();
      show(toLoc(r));
    }
  }

  function useLocation() {
    if (!navigator.geolocation) { fallbackCity(); return; }
    setStatus("Finding your location…");
    navigator.geolocation.getCurrentPosition(function (p) {
      var loc = { lat: p.coords.latitude, lon: p.coords.longitude, name: "My location", admin: "", country: "" };
      // Best-effort reverse geocode for a friendly name.
      fetchJson("https://geocoding-api.open-meteo.com/v1/reverse?latitude=" + loc.lat +
        "&longitude=" + loc.lon + "&language=en&format=json")
        .then(function (d) { if (d.results && d.results[0]) loc = toLoc(d.results[0]); })
        .catch(function () {})
        .then(function () { show(loc); });
    }, function () { fallbackCity(); }, { timeout: 9000, maximumAge: 600000 });
  }

  function fallbackCity() {
    // Default to Calgary if we can't use location.
    show({ lat: 51.05, lon: -114.07, name: "Calgary", admin: "Alberta", country: "Canada" });
  }

  function setUnits(u) {
    units = u;
    localStorage.setItem("bw-units", u);
    els.unitC.classList.toggle("active", u === "metric");
    els.unitF.classList.toggle("active", u === "imperial");
    if (lastLoc) show(lastLoc);
  }

  // ================= radar map (Leaflet + Mapbox + RainViewer) =================
  var map = null, mapInited = false, locMarker = null;
  var rvHost = "", frames = [], pastCount = 0, animPos = 0;
  var radarLayer = null; // a single radar layer whose URL we swap per frame
  var warmed = {}, warmImgs = [], warmTimer = null; // tile-cache preloading
  var modelCircle = null;

  // Approximate grid resolution of the high-res model Open-Meteo tends to pick
  // per region (best_match blends models, so this is an estimate). name, km,
  // and bounding box [south, west, north, east]; finest match wins.
  var FORECAST_MODELS = [
    { n: "MET Nordic",   km: 1,   bb: [55, -10, 72, 42] },
    { n: "AROME",        km: 1.3, bb: [42, -5, 51, 9] },
    { n: "UKV",          km: 2,   bb: [48, -11, 61, 2] },
    { n: "ICON-D2",      km: 2.2, bb: [43.2, -3.9, 58.1, 20.3] },
    { n: "HRDPS",        km: 2.5, bb: [39, -142, 70, -52] },
    { n: "HRRR",         km: 3,   bb: [21, -134, 53, -60] },
    { n: "MSM (JMA)",    km: 5,   bb: [22, 120, 48, 150] },
    { n: "ICON-EU",      km: 7,   bb: [29.5, -23.5, 70.5, 45] }
  ];
  function modelForLoc(lat, lon) {
    var best = null;
    for (var i = 0; i < FORECAST_MODELS.length; i++) {
      var m = FORECAST_MODELS[i], b = m.bb;
      if (lat >= b[0] && lat <= b[2] && lon >= b[1] && lon <= b[3] && (!best || m.km < best.km)) best = m;
    }
    return best || { n: "Global (GFS/ICON)", km: 11 };
  }
  function drawModelCircle(loc) {
    if (!map || !loc) return;
    var m = modelForLoc(loc.lat, loc.lon);
    var radius = m.km * 500; // metres; the circle's diameter ≈ one grid cell
    if (!modelCircle) {
      modelCircle = L.circle([loc.lat, loc.lon], {
        radius: radius, color: "#ffd166", weight: 1.5, opacity: 0.9,
        fillColor: "#ffd166", fillOpacity: 0.12, interactive: false
      }).addTo(map);
    } else {
      modelCircle.setLatLng([loc.lat, loc.lon]);
      modelCircle.setRadius(radius);
    }
    els.radarModel.textContent = "Zoom in to see yellow circle = forecast area";
  }

  function recenterMap(loc) {
    if (map && loc) {
      map.setView([loc.lat, loc.lon], map.getZoom());
      if (locMarker) locMarker.setLatLng([loc.lat, loc.lon]);
      drawModelCircle(loc);
    }
  }

  function addBasemap() {
    if (MAPBOX_TOKEN) {
      L.tileLayer("https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}", {
        id: "mapbox/dark-v11", tileSize: 512, zoomOffset: -1, maxZoom: 20,
        accessToken: MAPBOX_TOKEN, attribution: '&copy; Mapbox &copy; OpenStreetMap'
      }).addTo(map);
    } else {
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }
  }

  function initRadar() {
    if (mapInited) { setTimeout(function () { map.invalidateSize(); }, 60); recenterMap(lastLoc); return; }
    if (!window.L) {
      document.getElementById("map").innerHTML =
        '<div class="maperr">The map library couldn\'t load. Check your connection and reopen this tab.</div>';
      return;
    }
    mapInited = true;
    var center = lastLoc ? [lastLoc.lat, lastLoc.lon] : [51.05, -114.07];
    map = L.map("map", { zoomControl: true, attributionControl: true, maxZoom: 20 }).setView(center, 9);
    addBasemap();
    locMarker = L.circleMarker(center, {
      radius: 8, color: "#ffffff", weight: 3, fillColor: "#fb8500", fillOpacity: 1
    }).addTo(map);
    drawModelCircle({ lat: center[0], lon: center[1] });
    map.on("moveend", warmCacheSoon); // re-warm the cache after zoom/pan
    setTimeout(function () { map.invalidateSize(); }, 60);
    loadRadarFrames();
  }

  // Keep ~15 min between frames (the source is ~10 min) to cut how much we
  // preload while still showing the trend.
  function subsample(list, minGap) {
    if (!list.length) return [];
    var out = [list[0]], last = list[0].time;
    for (var i = 1; i < list.length; i++) {
      if (list[i].time - last >= minGap) { out.push(list[i]); last = list[i].time; }
    }
    if (out[out.length - 1] !== list[list.length - 1]) out.push(list[list.length - 1]);
    return out;
  }

  function loadRadarFrames() {
    fetchJson("https://api.rainviewer.com/public/weather-maps.json").then(function (api) {
      rvHost = api.host;
      var sp = subsample((api.radar && api.radar.past) || [], 14 * 60);
      var sn = subsample((api.radar && api.radar.nowcast) || [], 14 * 60);
      frames = sp.concat(sn);
      pastCount = sp.length;
      if (!frames.length) { els.frameTime.textContent = "No radar data"; return; }
      els.frameSlider.max = frames.length - 1;
      animPos = Math.max(0, pastCount - 1); // start at the latest observed frame ("now")
      els.frameSlider.value = animPos;
      showFrame(animPos);
      setTimeout(warmCache, 300); // preload the other frames so scrubbing is instant
    }).catch(function () { els.frameTime.textContent = "Radar unavailable"; });
  }

  // Warm the browser cache with every frame's tiles for the current view, so the
  // single radar layer can swap frames instantly (no on-the-spot fetch).
  function warmCache() {
    if (!map || !rvHost || !frames.length) return;
    var tz = Math.min(Math.round(map.getZoom()), 7);
    var n = Math.pow(2, tz);
    var b = map.getBounds();
    var nw = map.project(b.getNorthWest(), tz).divideBy(256).floor();
    var se = map.project(b.getSouthEast(), tz).divideBy(256).floor();
    warmImgs = [];
    for (var f = 0; f < frames.length; f++) {
      for (var x = nw.x - 1; x <= se.x + 1; x++) {
        for (var y = nw.y - 1; y <= se.y + 1; y++) {
          if (y < 0 || y >= n) continue;
          var xx = ((x % n) + n) % n;
          var url = rvHost + frames[f].path + "/256/" + tz + "/" + xx + "/" + y + "/2/1_0.png";
          if (warmed[url]) continue;
          warmed[url] = true;
          var img = new Image();
          img.decoding = "async";
          img.src = url; // browser caches the response
          warmImgs.push(img);
        }
      }
    }
  }

  function warmCacheSoon() {
    clearTimeout(warmTimer);
    warmTimer = setTimeout(warmCache, 350);
  }

  // colour scheme 2 (blue = light precipitation -> yellow -> orange -> red = heavy);
  // options "1_0" = smoothed, snow NOT shown as a separate colour (in this scheme
  // snow and light rain are both blue, which misreads as "snow everywhere")
  function frameUrl(fr) { return rvHost + fr.path + "/256/{z}/{x}/{y}/2/1_0.png"; }

  function frameLabel(i) {
    els.frameSlider.value = i;
    var opts = { hour: "numeric", minute: "2-digit" };
    if (lastTz) opts.timeZone = lastTz; // show the active location's local time
    var t = new Date(frames[i].time * 1000).toLocaleTimeString([], opts);
    // RainViewer's free feed no longer includes future frames, so the newest
    // frame is "now"; anything beyond past would be a nowcast if present.
    els.frameTime.textContent =
      i === frames.length - 1 ? t + " · now" : (i >= pastCount ? t + " · forecast" : t);
  }

  function loadFrame(i) {
    var fr = frames[i];
    if (!radarLayer) {
      radarLayer = L.tileLayer(frameUrl(fr), {
        // RainViewer's free tiles top out at zoom 7; upscale beyond that so we
        // never request unsupported zooms (which return a placeholder tile).
        opacity: 0.72, tileSize: 256, maxNativeZoom: 7, maxZoom: 20,
        updateWhenZooming: false, keepBuffer: 1,
        attribution: "Radar &copy; RainViewer"
      }).addTo(map);
    } else {
      radarLayer.setUrl(frameUrl(fr));
    }
  }

  function showFrame(i) {
    if (!frames.length) return;
    i = (i % frames.length + frames.length) % frames.length;
    animPos = i;
    frameLabel(i);
    loadFrame(i);
  }

  // Throttle tile loads while dragging so scrubbing stays smooth and we don't
  // hammer the rate-limited tile server. The label tracks instantly; tiles
  // load at most a few times a second, and the final frame loads on release.
  var scrubTimer = null, scrubPending = null;
  function scrubTo(i) {
    if (!frames.length) return;
    animPos = i;
    frameLabel(i);
    scrubPending = i;
    if (scrubTimer) return;
    scrubTimer = setTimeout(function () {
      scrubTimer = null;
      if (scrubPending != null) { loadFrame(scrubPending); scrubPending = null; }
    }, 80);
  }

  function selectTab(name) {
    currentTab = name;
    var radar = name === "radar";
    els.tabRadar.classList.toggle("active", radar);
    els.tabWeather.classList.toggle("active", !radar);
    els.radar.classList.toggle("hidden", !radar);
    if (radar) {
      els.result.classList.add("hidden");
      els.status.classList.add("hidden");
      initRadar();
    } else {
      if (loaded) els.result.classList.remove("hidden");
      else els.status.classList.remove("hidden");
    }
  }

  // ---- events ----
  els.cityPill.addEventListener("click", openModal);
  els.closeModal.addEventListener("click", closeModal);
  els.backdrop.addEventListener("click", function (e) { if (e.target === els.backdrop) closeModal(); });
  els.searchInput.addEventListener("input", onSearchInput);
  els.searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var first = els.results.querySelector("li[data-i]");
      if (first) first.click();
    } else if (e.key === "Escape") { closeModal(); }
  });
  els.results.addEventListener("click", onResultsClick);
  els.unitC.addEventListener("click", function () { setUnits("metric"); });
  els.unitF.addEventListener("click", function () { setUnits("imperial"); });
  els.tabWeather.addEventListener("click", function () { selectTab("weather"); });
  els.tabRadar.addEventListener("click", function () { selectTab("radar"); });
  els.frameSlider.addEventListener("input", function () { scrubTo(+els.frameSlider.value); });
  els.frameSlider.addEventListener("change", function () { showFrame(+els.frameSlider.value); });
  bindThumb(els.hourly, els.hThumb);
  bindThumb(els.daily, els.dThumb);
  window.addEventListener("resize", function () {
    updateThumb(els.hourly, els.hThumb);
    updateThumb(els.daily, els.dThumb);
    positionMarker(els.hourly, els.hMarker, "now");
    positionMarker(els.daily, els.dMarker, "today");
    if (map && currentTab === "radar") map.invalidateSize();
  });

  // ---- init ----
  els.unitC.classList.toggle("active", units === "metric");
  els.unitF.classList.toggle("active", units === "imperial");
  useLocation();
})();
</script>
</body>
</html>
